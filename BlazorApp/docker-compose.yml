services:
  db:
    image: mysql:latest
    container_name: my_database
    env_file:
      - secret.env
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app_network
    ports:
      - "3306:3306"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
    
  webside:
    container_name: webside
    image: s224307/website:dev
    ports:
      - 8080:8080

volumes:
  db_data:
    driver: local

networks:
  app_network:
    driver: bridge