# Kun til lokal udvikling. Passwords her er offentlige testværdier.
services:
  webside-test-db:
    container_name: webside-test-db
    image: s224307/website-db:test
    environment:
      MYSQL_ROOT_PASSWORD: local-root-only
      MYSQL_DATABASE: webapp
      MYSQL_USER: webapp
      MYSQL_PASSWORD: "1234"
    volumes:
      - webside-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER -D webapp -e 'SELECT id FROM users LIMIT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
      
  webside-test:
    container_name: webside-test
    image: s224307/website:test
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__UsersDatabase: "Server=webside-test-db;Port=3306;Database=webapp;User ID=webapp;Password=1234;"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      webside-test-db:
        condition: service_healthy
volumes:
  webside-mysql-data:
    external: true